server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unmatched path serves index.html so React Router
    # handles client-side routes like /item/3 or /reset-password/<token>.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /images/ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
