# docker-compose for local/dev use. Not hardened for production (plaintext
# passwords via environment, no secrets manager, no resource limits) — see
# docs/DELIVERABLES_COVERAGE.md for what a production compose/k8s setup adds.
version: '3.9'

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: lalaland_cafe
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Root
    ports:
      - '5432:5432'
    volumes:
      - lalaland_pgdata:/var/lib/postgresql/data
      # Runs once, only on first container init, in alphabetical order —
      # this is what replaces the manual `psql -f schema.sql / seed.sql` steps.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: lalaland_cafe
      DB_USER: postgres
      DB_PASSWORD: Root
      JWT_ACCESS_SECRET: change_this_in_a_real_deployment
      JWT_ACCESS_EXPIRES_IN: 15m
      CORS_ORIGIN: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    ports:
      - '5000:5000'
    volumes:
      # Persist uploaded menu images across container restarts/rebuilds —
      # local disk still doesn't survive most PaaS redeploys, so a real
      # deployment should point this at S3/GCS instead (see README §12).
      - lalaland_uploads:/app/public/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '3000:80'

volumes:
  lalaland_pgdata:
  lalaland_uploads:
